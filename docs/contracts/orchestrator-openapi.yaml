openapi: 3.0.3
info:
  title: Migration Orchestrator API
  version: 0.1.0
paths:
  /api/runs:
    post:
      summary: Create a migration run
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRun'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
    get:
      summary: List runs
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Run'}}}}}
  /api/runs/{runId}:
    get:
      summary: Get run with progress
      parameters: [{name: runId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '404': {description: Not found}
  /api/runs/{runId}/transitions:
    post:
      summary: Request a state transition (pre-checks run first)
      parameters: [{name: runId, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200': {description: Transition accepted}
        '409': {description: Pre-check failed or illegal transition}
        '403': {description: Approval required}
  /api/runs/{runId}/exceptions:
    get:
      summary: List quarantined rows
      parameters: [{name: runId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: OK}
  /api/runs/{runId}/reconciliation:
    get:
      summary: Reconciliation report (counts, sums, per-loan diffs)
      parameters: [{name: runId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: OK}
  /api/runs/{runId}/load:
    post:
      summary: Run the initial bulk load from the legacy extract
      parameters: [{name: runId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: Load summary}
  /api/runs/{runId}/shadow-diff:
    get:
      summary: Shadow-read comparison of source and target
      parameters: [{name: runId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: OK}
  /api/runs/{runId}/audit:
    get:
      summary: Audit trail for the run
      parameters: [{name: runId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: OK}
  /api/runs/{runId}/mappings:
    get:
      summary: List mappings and their review status
      parameters: [{name: runId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: OK}
  /api/runs/{runId}/mappings/suggest:
    post:
      summary: Ask the AI service to suggest field mappings
      parameters: [{name: runId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: OK}
  /api/runs/{runId}/mappings/{source}:
    put:
      summary: Approve or reject one mapping (reviewer role)
      parameters:
        - {name: runId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: source, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
components:
  schemas:
    CreateRun:
      type: object
      required: [tenantId]
      properties:
        tenantId: {type: string}
    Run:
      type: object
      properties:
        runId: {type: integer, format: int64}
        tenantId: {type: string}
        state: {type: string, enum: [PLANNED, PROFILED, INITIAL_LOAD, CDC_SYNC, SHADOW_VERIFY, READY, FREEZE, FINAL_SYNC, SWITCHED, MONITOR, DONE, ROLLED_BACK]}
    TransitionRequest:
      type: object
      required: [target]
      properties:
        target: {type: string}
        approvedBy: {type: string, description: Required for SWITCHED}
