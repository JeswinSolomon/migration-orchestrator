server:
  port: 8081

spring:
  datasource:
    url: ${TARGET_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${TARGET_DB_USER}
    password: ${TARGET_DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

migration:
  legacy-dir: ${MIGRATION_LEGACY_DIR:../legacy-data/data}
  ai-url: ${AI_SERVICE_URL:http://localhost:8000}
  # name:password:ROLE|ROLE;name2:password2:ROLE  (no default: the service refuses to start without it)
  users: ${MIGRATION_USERS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
