services:
  legacy-db:
    image: postgres:16
    environment:
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy
      POSTGRES_DB: legacy
    command: ["postgres", "-c", "wal_level=logical"]
    ports: ["5432:5432"]

  target-db:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: target
      APP_USER: orchestrator
      APP_USER_PASSWORD: orchestrator
    ports: ["1521:1521"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
